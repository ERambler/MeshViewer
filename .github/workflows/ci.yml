name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write       # создание релиза по тегу

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish (NativeAOT)
        run: dotnet publish -c Release -r win-x64 -o publish

      # MeshViewer.exe — оконная подсистема: без перехвата вывода PowerShell её не ждёт, и код выхода пустой
      - name: Loaders (GLB + OBJ, without a window)
        shell: pwsh
        run: |
          foreach ($model in 'tests/fixtures/cubes.glb', 'tests/fixtures/cube.obj') {
            $report = Join-Path $env:RUNNER_TEMP 'info.txt'
            $process = Start-Process -FilePath publish/MeshViewer.exe -ArgumentList '--info', $model -Wait -PassThru -NoNewWindow -RedirectStandardOutput $report
            Get-Content $report
            if ($process.ExitCode -ne 0) { exit 1 }
          }

      - name: Version and release archive
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Select-Xml -Path MeshViewer.csproj -XPath "//Version").Node.InnerText
          $tag = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($version -ne $tag) { throw "tag v$tag does not match <Version>$version</Version> in MeshViewer.csproj" }
          Compress-Archive -Path publish/MeshViewer.exe, publish/SDL2.dll, publish/openal.dll -DestinationPath "MeshViewer-$version.zip"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "MeshViewer-$env:VERSION.zip" --title "MeshViewer $env:VERSION" --generate-notes
